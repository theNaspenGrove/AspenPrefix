name: NaspenPrefix
version: ${project.version}
main: mov.naspen.naspenprefix.NaspenPrefix
api-version: 1.17
prefix: NaspenPrefix
depend: [LuckPerms,Periderm]
authors: [naspen]
website: https://naspen.mov
commands:
  prefix:
    description: Primary prefix command
    usage: /prefix
    permission: naspenprefix.command.prefix

permissions:
  naspenprefix.command.prefix:
    description: Ability to run the Prefix command. Required for all sub-commands
    default: false
  naspenprefix.command.prefix.list:
    description: Ability to list the prefixes you have access to. Requires the 'NaspenPrefix.prefixCommand' permission
    default: true
  naspenprefix.command.prefix.select:
    description: Ability to select the prefix you want to use out of a list of the prefixes you have access to. Requires the 'AspenPrefix.prefixCommand' permission
    default: true
  naspenprefix.command.prefix.set.custom.own:
    description: Ability to set your own custom prefix. Requires the 'NaspenPrefix.prefixCommand' permission
    default: false